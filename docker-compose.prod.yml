# Production-style build of the API on the VPS (Docker option; PM2 is the alternative — see
# docs/03-architecture/deployment.md).
#
#   cp apps/api/.env.prod.example apps/api/.env.prod   # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# No mongo service: MongoDB is Atlas-hosted (allowlist the VPS IP). Nginx terminates TLS in front
# of 127.0.0.1:4000. Keep exactly ONE api instance (it runs the reminder cron).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [apps/api/.env.prod]
    ports: ['${API_BIND:-127.0.0.1}:${API_HOST_PORT:-4000}:4000']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
