packages:
  - "apps/*"
  - "packages/*"

# esbuild ships its binary as a platform package; its postinstall is only an optimisation.
allowBuilds:
  '@scarf/scarf': false
  esbuild: false

# Expo / React Native needs one copy of React and a hoisted node_modules (see docs/mobile/03-architecture.md section 2).
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.20"
  - "@expo/fingerprint@0.21.10"
  - "@expo/metro-config@58.0.22"
  - "@expo/router-server@58.0.22"
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo@58.0.24
  - expo-linking@58.0.17
  - expo-router@58.0.31
  - expo-location@58.0.22
  - expo-sqlite@58.0.17
nodeLinker: hoisted
overrides:
  react: 19.3.0
  react-dom: 19.3.0
